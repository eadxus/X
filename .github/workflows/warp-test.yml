name: Test Cloudflare WARP Traffic

on:
  workflow_dispatch: # 支持手动触发

jobs:
  test-warp:
  # 使用最新的 Ubuntu 运行环境
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 🌍 记录安装 WARP 之前的原始公网 IP
      - name: 🌍 Check Original Public IP
        run: |
          echo "Original Public IP:"
          curl -4s https://api.ipify.org
          echo

      # 📦 安装抓包工具 tcpdump
      - name: 📦 Install tcpdump
        run: |
          sudo apt-get update && sudo apt-get install -y tcpdump

      # 🔴 开始后台抓包（监听所有网卡，重点关注 53 和 443 端口，保存为 warp_traffic.pcap）
      - name: 🔴 Start Packet Capture (Background)
        run: |
          # -i any 监听所有接口，port 53 or port 443 过滤 DNS 和 HTTPS 流量
          sudo tcpdump -i any 'port 53 or port 443' -w /tmp/warp_traffic.pcap &
          echo "TCPDUMP_PID=$!" >> $GITHUB_ENV
          sleep 2

      # ☁️ 安装 Cloudflare WARP
      - name: ☁️ Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor \
            -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

      # 🚀 启动 WARP 客户端并连接
      - name: 🚀 Start Cloudflare WARP
        run: |
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos connect
          sleep 5
          sudo warp-cli --accept-tos status

      # 🌐 确认 WARP 已接管网络并主动触发一些 DNS 及 443 请求产生流量
      - name: 🌐 Trigger Test Traffic & Check IP
        run: |
          echo "WARP Public IP (After Proxy Enabled):"
          curl -4s https://api.ipify.org
          echo
          echo "Cloudflare Connection Trace:"
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep '^warp='
          
          # 主动触发几个域名解析和 HTTPS 请求，确保持续产生 53 和 443 流量
          echo "Triggering test traffic..."
          nslookup www.cloudflare.com || true
          curl -sI https://www.cloudflare.com || true
          curl -sI https://one.one.one.one || true

      # ⏹️ 停止抓包并输出简要统计
      - name: ⏹️ Stop Packet Capture & Analyze
        run: |
          # 优雅停止 tcpdump 进程
          sudo pkill -SIGINT tcpdump || true
          sleep 3
          
          echo "=== 53 端口 (DNS) 简要流量概览 ==="
          sudo tcpdump -nnr /tmp/warp_traffic.pcap 'port 53' -c 20 || true
          
          echo -e "\n=== 443 端口 (HTTPS) 连接的目标 IP 概览 ==="
          sudo tcpdump -nnr /tmp/warp_traffic.pcap 'port 443' 2>/dev/null | awk '{print $3}' | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | sort -u || true

      # 📤 上传数据包文件到 GitHub Artifacts
      - name: 📤 Upload Packet Capture Artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-network-traffic
          path: /tmp/warp_traffic.pcap
          retention-days: 1
