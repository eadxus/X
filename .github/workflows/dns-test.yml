name: DNS IPv6 Diagnostic

'on': workflow_dispatch:

jobs: dns-test: runs-on: ubuntu-latest

steps:
  - name: Install DNS tools
    run: |
      sudo apt-get update
      sudo apt-get install -y dnsutils jq

  - name: Test DNS records
    run: |
      for domain in www.google.com google.com; do
        for type in A AAAA; do
          echo ""
          echo "================================"
          echo "$domain $type"
          echo "================================"

          echo "--- Cloudflare ---"
          curl -fsS \
            -H 'accept: application/dns-json' \
            "https://cloudflare-dns.com/dns-query?name=${domain}&type=${type}" \
            | jq -r '.Answer[]?.data'

          echo "--- Google DNS ---"
          curl -fsS \
            "https://dns.google/resolve?name=${domain}&type=${type}" \
            | jq -r '.Answer[]?.data'

          echo "--- Quad9 ---"
          curl -fsS \
            -H 'accept: application/dns-json' \
            "https://dns.quad9.net/dns-query?name=${domain}&type=${type}" \
            | jq -r '.Answer[]?.data' || true

          echo "--- System DNS ---"
          dig +short "$domain" "$type"
        done
      done

  - name: DNS Trace
    run: |
      dig +trace www.google.com AAAA || true

  - name: IPv6 Connectivity
    run: |
      curl -6 -I --connect-timeout 10 https://www.google.com || true
